<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giti GitiSport S2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet" />
    <!-- loader styles inline, so it shows before the scripts and the 3D files arrive -->
    <style>
      html, body { margin: 0; background: #c9c7c4; }
      #loader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #c9c7c4; color: #000;
        font: 600 11px/1 'Archivo', system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase;
        transition: opacity 0.7s ease, visibility 0.7s;
      }
      #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
      /* a little tire rolling forward on a moving road */
      .loader-road { position: relative; width: 220px; height: 96px; overflow: hidden; }
      .loader-wheel {
        position: absolute; left: 66px; top: 0; width: 88px; height: 88px;
        animation: loader-spin 1.2s linear infinite;
      }
      .loader-road::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: 6px; height: 2px;
        background: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 26px);
        animation: loader-road 1.2s linear infinite;
        -webkit-mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
        mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
      }
      .loader-bar { width: 160px; height: 2px; background: rgba(0, 0, 0, 0.15); overflow: hidden; }
      .loader-bar > i { display: block; height: 100%; width: 4%; background: #000; transition: width 0.4s ease; }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      /* one wheel turn = 2 pi x 41 px (the tire's radius on screen) = 260 px of road, 10 dash periods */
      @keyframes loader-road { from { background-position: 0 0; } to { background-position: -260px 0; } }
      @media (prefers-reduced-motion: reduce) {
        .loader-wheel, .loader-road::after { animation-duration: 4s; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading">
      <div class="loader-road">
        <svg class="loader-wheel" viewBox="0 0 100 100" aria-hidden="true">
          <!-- tread blocks, sidewall, rim, spokes, yellow hub -->
          <circle cx="50" cy="50" r="44" fill="none" stroke="#000" stroke-width="6" stroke-dasharray="7.5 4.02" />
          <circle cx="50" cy="50" r="36" fill="none" stroke="#000" stroke-width="10" />
          <circle cx="50" cy="50" r="27" fill="none" stroke="#000" stroke-width="2.5" />
          <g stroke="#000" stroke-width="3.5" stroke-linecap="round">
            <line x1="50" y1="50" x2="50" y2="25" />
            <line x1="50" y1="50" x2="73.8" y2="42.3" />
            <line x1="50" y1="50" x2="64.7" y2="70.2" />
            <line x1="50" y1="50" x2="35.3" y2="70.2" />
            <line x1="50" y1="50" x2="26.2" y2="42.3" />
          </g>
          <circle cx="50" cy="50" r="7" fill="#ffe000" stroke="#000" stroke-width="2.5" />
        </svg>
      </div>
      <div class="loader-bar"><i id="loader-bar"></i></div>
      <span>Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/site/main.jsx"></script>
  </body>
</html>
